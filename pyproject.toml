[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patautoedit"
dynamic = ["version"]
description = "Edit ATP pattern files for Teradyne IG-XL testers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jerry Zhou" }]
keywords = ["ATP", "IG-XL", "Teradyne", "pattern"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
patautoedit = "patautoedit.cli:main"

[project.urls]
Homepage = "https://github.com/showjim/PatAutoEdit"
Repository = "https://github.com/showjim/PatAutoEdit"

[tool.setuptools]
packages = ["patautoedit"]

[tool.setuptools.dynamic]
version = { attr = "patautoedit.__version__" }
